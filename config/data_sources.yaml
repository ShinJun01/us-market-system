# 데이터 소스 설정
# provider: synthetic   # 로컬에서는 composite 권장 | yahoo | cboe | composite
#   composite = VIX 계열은 CBOE 공식 CSV, 나머지는 yfinance. 로컬 권장값.
#   synthetic = 합성 데이터. 네트워크 없이 파이프라인 검증용. 실제 판단 근거로 사용 금지.
#   yahoo     = yfinance. 로컬(집)에서 사용. Phase 1 무료 검증용.
provider: synthetic   # 로컬에서는 composite 권장
cache_dir: data/cache
start_date: "2015-01-01"

# 레짐 엔진 필수 심볼. 하나라도 없으면 V6 커버리지 게이트에서 HALT.
symbols:
  index:      [SPY, QQQ, IWM, RSP]
  # ^VIX9D/^VIX3M은 yfinance가 불안정하다 -> provider: composite 사용 시
  # CBOE 공식 CSV에서 받아온다. 기간구조는 VIX 레벨과 달리 선행성이 있어
  # 빠뜨리면 레짐 엔진이 급락을 사후에만 인지하게 된다.
  volatility: ["^VIX", "^VIX9D", "^VIX3M"]
  rates_fx:   ["^TNX", "DX-Y.NYB"]
  credit:     [HYG, IEF]
  sectors:    [XLK, XLF, XLV, XLY, XLP, XLI, XLE, XLU, XLRE, XLB, XLC]

breadth:
  mode: compute       # proxy | compute
  # proxy   : RSP/SPY 등에서 근사. 정확도 낮음 -> Phase 2 전에 compute로 전환 필수.
  # compute : S&P500 구성종목 전체 일봉으로 %above50DMA / %above200DMA / NH-NL 직접 계산.
  constituents_file: config/sp500_constituents.csv

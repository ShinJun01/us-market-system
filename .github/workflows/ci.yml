name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyyaml pyarrow pytest tabulate

      - name: Tests
        run: pytest -q

      - name: Look-ahead 방지 검사
        run: |
          # 신호 생성 경로에서 forward_return을 쓰면 미래 데이터를 참조하게 된다.
          if grep -rn "forward_return" usv2/engines/ usv2/brief/ usv2/data/ \
               --include="*.py" | grep -v "indicators.py"; then
            echo "::error::신호 생성 경로에서 forward_return 사용 감지 (look-ahead bias)"
            exit 1
          fi
          echo "OK — 신호 경로에 미래 참조 없음"

      - name: 파이프라인 스모크 테스트
        run: python scripts/run_daily.py
